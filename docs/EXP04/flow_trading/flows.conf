# flows.conf — Configurazione flussi di trading
#
# Formato: src_ip dst_ip src_port dst_port proto(tcp|udp)
#
# Ogni riga definisce un flusso che la DPU deve intercettare.
# I pacchetti che matchano vengono inviati al worker DPI sulla CPU ARM.
# Tutto il resto viene droppato in hardware.
#
# Scenario: DPU-2 (exchange) → DPU-3 (trading engine)
#   DPU-2 p1: 192.168.58.201
#   DPU-3 p1: 192.168.58.200

# Feed ordini TCP (canale affidabile)
192.168.58.201 192.168.58.200 1234 5678 tcp

# Feed ordini UDP (market data multicast)
192.168.58.201 192.168.58.200 1234 5678 udp

# Feed prezzi UDP su porta diversa
192.168.58.201 192.168.58.200 1234 9999 udp
